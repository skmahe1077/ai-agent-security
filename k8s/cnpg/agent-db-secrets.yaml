# Password Secrets for CloudNativePG's declarative login roles
# (k8s/cnpg/cluster.yaml's spec.managed.roles). `username` MUST match the
# role name exactly -- CloudNativePG's own documented requirement.
#
# The SAME password values are also applied as k8s/mahi-tools/db-secrets.yaml
# in the `agents` namespace, so mahi-tools can actually connect as these
# roles -- Secrets are namespace-scoped, so one password needs two copies,
# generated once by scripts/01-provision.sh and substituted into both.
apiVersion: v1
kind: Secret
metadata:
  name: agent-order-db-creds
  namespace: data
type: kubernetes.io/basic-auth
stringData:
  username: agent_order_login
  password: "${AGENT_ORDER_DB_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-refund-db-creds
  namespace: data
type: kubernetes.io/basic-auth
stringData:
  username: agent_refund_login
  password: "${AGENT_REFUND_DB_PASSWORD}"
