apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    # Registry root in repoURL + chart name as its own field -- confirmed
    # live: ArgoCD rejects an OCI source with the whole chart path folded
    # into repoURL and no explicit `chart`, even though `helm pull
    # oci://docker.io/envoyproxy/gateway-helm` on that full path works
    # fine standalone ("spec.source.repoURL and either spec.source.path
    # or spec.source.chart are required").
    repoURL: oci://docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: 1.9.3
    helm: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
