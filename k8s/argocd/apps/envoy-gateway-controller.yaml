apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    # Bare registry hostname in repoURL (NO oci:// prefix), full path
    # folded into `chart` -- confirmed live, the hard way: an `oci://`-
    # prefixed repoURL makes ArgoCD's revision/digest-resolution step
    # (separate from the actual chart-pull path) send an UNAUTHENTICATED
    # HEAD request for the digest, which Docker Hub refuses with 401 even
    # for a fully public chart (confirmed empirically: the identical
    # request succeeds once a bearer token is attached). This is a known
    # ArgoCD bug (argoproj/argo-cd#25513) specific to the oci:// prefix in
    # repoURL -- the maintainer-confirmed fix is to omit the prefix
    # entirely and move the registry path into `chart` instead.
    repoURL: docker.io
    chart: envoyproxy/gateway-helm
    targetRevision: 1.9.3
    helm: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
