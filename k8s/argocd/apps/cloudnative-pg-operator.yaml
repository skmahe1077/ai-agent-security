apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
  # Confirmed live, repeatedly: CloudNativePG's own CRDs
  # (clusters.postgresql.cnpg.io, poolers.postgresql.cnpg.io) are large
  # enough that the kubectl.kubernetes.io/last-applied-configuration
  # annotation ArgoCD writes during its patch exceeds Kubernetes' own
  # 262144-byte annotation limit outright -- "metadata.annotations: Too
  # long". Neither ServerSideApply=true nor Replace=true above stop this --
  # confirmed by repeated identical failures with both set. Helm's
  # source.helm.skipCrds was also tried and had NO effect -- these CRDs
  # ship as regular chart templates, not via Helm's special `crds/`
  # directory, which is the only thing skipCrds controls. The actual fix:
  # tell ArgoCD's diff engine to ignore CustomResourceDefinition annotations
  # entirely, so it never attempts to write that oversized annotation. The
  # CRDs' schemas (the only part that matters) are still applied once,
  # out-of-band, via `helm template --include-crds | kubectl apply
  # --server-side --force-conflicts` -- see docs/RUNBOOK.md -- and this
  # Application manages every other resource (Deployment, RBAC, webhooks)
  # normally.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
        # Kubernetes itself defaults spec.conversion.strategy to "None" on
        # any v1 CRD that doesn't declare one -- this chart's controller-gen
        # output doesn't set it, so the live object always carries a field
        # the desired manifest never had. Confirmed live: this chart's
        # clusters/poolers CRDs are otherwise byte-identical (full spec hash
        # match) once this field is excluded, but ArgoCD still attempted a
        # patch (hitting the annotation-size bug) over this one defaulted
        # field alone until it was added here too.
        - /spec/conversion
