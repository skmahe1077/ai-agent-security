apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
    helm:
      # ServerSideApply=true + Replace=true (below) do NOT stop ArgoCD's
      # dry-run step from client-side-applying these CRDs first -- confirmed
      # live, repeatedly: the sync keeps failing on the identical
      # 262144-byte annotation error even with both options set. skipCrds
      # stops ArgoCD from ever rendering the CRD manifests via Helm at all,
      # which is the only thing that actually avoids the broken code path.
      # The CRDs themselves are applied once, out-of-band, via
      # `helm template --include-crds | kubectl apply --server-side
      # --force-conflicts` -- see docs/RUNBOOK.md.
      skipCrds: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Confirmed live: CloudNativePG's own CRDs (clusters.postgresql.cnpg.io,
      # poolers.postgresql.cnpg.io) are large enough that client-side
      # apply's kubectl.kubernetes.io/last-applied-configuration annotation
      # exceeds Kubernetes' 262144-byte annotation limit outright --
      # "metadata.annotations: Too long". ServerSideApply=true alone was
      # NOT enough on the ArgoCD version this demo runs (v3.5.6): a known
      # regression (argoproj/argo-cd#28421, "server-side dry-run workaround
      # applies large CRDs client-side") means ArgoCD's dry-run/diff step
      # still does a client-side apply first even with ServerSideApply set,
      # hitting the same limit before the real server-side apply ever runs.
      # Replace=true bypasses that dry-run phase entirely -- the documented
      # workaround for this exact regression.
      - ServerSideApply=true
      - Replace=true
