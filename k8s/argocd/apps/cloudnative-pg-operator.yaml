apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
  # CloudNativePG's own CRDs (clusters.postgresql.cnpg.io,
  # poolers.postgresql.cnpg.io) are large enough that ArgoCD's sync hits a
  # real regression (argoproj/argo-cd#28421): it writes the full
  # kubectl.kubernetes.io/last-applied-configuration annotation during a
  # one-time bootstrap client-side-apply for any CRD it doesn't yet
  # recognize as ArgoCD-managed, which exceeds Kubernetes' 262144-byte
  # annotation limit outright. Confirmed, repeatedly, that NEITHER
  # ServerSideApply=true/Replace=true above NOR a per-Application
  # ignoreDifferences on the CRD's annotations/spec.conversion stop this --
  # ignoreDifferences only affects drift *detection*, not this apply path.
  # The actual fix is cluster-wide: k8s/argocd/argocd-cm-patch.yaml's
  # `resource.exclusions` removes CustomResourceDefinition from ArgoCD's
  # pipeline entirely. This Application still manages every other resource
  # (Deployment, RBAC, webhooks) normally; the CRDs themselves are applied
  # once, out-of-band, via `helm template --include-crds | kubectl apply
  # --server-side --force-conflicts` -- see docs/RUNBOOK.md.
