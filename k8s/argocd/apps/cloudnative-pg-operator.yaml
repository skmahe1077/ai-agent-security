apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Confirmed live: CloudNativePG's own CRDs (clusters.postgresql.cnpg.io,
      # poolers.postgresql.cnpg.io) are large enough that client-side
      # apply's kubectl.kubernetes.io/last-applied-configuration annotation
      # (which embeds the entire resource as JSON) exceeds Kubernetes'
      # 262144-byte annotation-value limit outright -- "metadata.annotations:
      # Too long". Server-side apply never writes that annotation.
      - ServerSideApply=true
