apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mahi-tools-rbac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/skmahe1077/ai-agent-security.git
    targetRevision: HEAD
    path: k8s/mahi-tools
    directory:
      include: "rbac.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
