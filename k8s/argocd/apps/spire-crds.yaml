apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://spiffe.github.io/helm-charts-hardened/
    chart: spire-crds
    targetRevision: 0.6.1
  destination:
    server: https://kubernetes.default.svc
    namespace: spire-mgmt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
