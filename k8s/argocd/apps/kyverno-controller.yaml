apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.2
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
  # Same large-CRD issue as cloudnative-pg-operator.yaml, same fix -- see
  # that Application's ignoreDifferences comment for the full explanation
  # (ServerSideApply/Replace don't help; skipCrds doesn't help either,
  # since these CRDs aren't in Helm's special crds/ directory).
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
