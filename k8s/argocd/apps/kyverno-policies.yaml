# Every ClusterPolicy in policy/kyverno/, no placeholders, nothing applied
# out of band -- this Application's selfHeal is what makes beat 4's
# "kubectl edit the policy away, watch ArgoCD revert it" demo real.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/skmahe1077/ai-agent-security.git
    targetRevision: HEAD
    path: policy/kyverno
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
