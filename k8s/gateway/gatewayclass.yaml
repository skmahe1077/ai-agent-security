# Cluster-scoped. The controller itself (Envoy Gateway's control plane)
# installs into envoy-gateway-system via Helm -- see scripts/01-provision.sh.
# This GatewayClass is what k8s/gateway/gateway.yaml's Gateway references.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # Wires in envoyproxy.yaml's filterOrder fix (jwt_authn before
  # ext_authz) -- see that file's header comment for why it's needed.
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: mahi-gateway-proxy-config
    namespace: envoy-gateway-system
