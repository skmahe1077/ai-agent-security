apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mahi-tools-route
  namespace: agents
spec:
  parentRefs:
    - name: mahi-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tools
      backendRefs:
        - name: mahi-tools
          port: 8000
    # /healthz is intentionally NOT routed through here -- only tool calls
    # need identity + policy enforcement. mahi-tools' own readinessProbe
    # hits it via the pod directly, not through the gateway.
