# The name here is the identity. SPIRE's ClusterSPIFFEID (k8s/spire/values.yaml)
# assigns spiffe://mahistores.demo/ns/agents/sa/<name> to any pod in the
# `agents` namespace labeled with the matching app= label running under
# THIS service account -- rename either one and the identity silently stops
# matching.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-support-agent-secure
  namespace: agents
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-order-agent
  namespace: agents
