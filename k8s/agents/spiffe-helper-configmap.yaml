# spiffe-helper writes the JWT-SVID to a file instead of the agent talking
# to the Workload API directly -- the Python `spiffe` library is 0.x with no
# official JWT-SVID example, too much risk on a live-demo critical path.
#
# jwt_audience is "gateway" -- Envoy Gateway's SecurityPolicy validates
# this exact `aud` claim, so an SVID minted for any other audience is
# refused.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-config
  namespace: agents
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir      = "/svids"
    daemon_mode   = true
    jwt_svids = [
      { jwt_audience = "gateway", jwt_svid_file_name = "jwt_svid.token" }
    ]
    renew_signal = "SIGUSR1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-config-order-agent
  namespace: agents
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir      = "/svids"
    daemon_mode   = true
    jwt_svids = [
      { jwt_audience = "gateway", jwt_svid_file_name = "jwt_svid.token" }
    ]
    renew_signal = "SIGUSR1"
