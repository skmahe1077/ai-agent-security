# order-agent: the read-only counterpart to agent-secure (refund-agent).
# Same image, same spiffe-helper sidecar pattern -- see
# agent-secure-deployment.yaml. Differs only in identity (ServiceAccount,
# app label, ClusterSPIFFEID): it is a genuinely separate SPIFFE identity,
# not a UI-level restriction. What it is ALLOWED to do is enforced by OPA
# (policy/rego -- a rule denies this identity's jwt.sub on
# POST /tools/issue_refund outright) and, as a backstop, by the Postgres
# role mahi-tools uses on its behalf having no INSERT grant on refunds.
# The storefront routes to this Service automatically; the customer never
# picks it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-agent
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-order-agent
  template:
    metadata:
      labels:
        app: ai-order-agent
    spec:
      serviceAccountName: ai-order-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000  # see agent-secure-deployment.yaml's comment -- same svids emptyDir pattern
      containers:
        - name: agent
          image: ${IMAGE_REGISTRY}/agent:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: AGENT_MODE
              value: secure
            - name: AGENT_NAME
              value: order-agent
            - name: SVID_PATH
              value: /svids/jwt_svid.token
            - name: GATEWAY_URL
              value: "http://mahi-gateway-stable.envoy-gateway-system.svc.cluster.local:8080"
            - name: AGENT_ENGINE
              value: "${AGENT_ENGINE:-deterministic}"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: anthropic-api-key, key: value, optional: true }
          volumeMounts:
            - name: svids
              mountPath: /svids
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }

        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.12.2
          args: ["-config", "/etc/spiffe-helper/helper.conf"]
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: svids
              mountPath: /svids
            - name: helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }

      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svids
          emptyDir: {}
        - name: helper-config
          configMap:
            name: spiffe-helper-config-order-agent
---
apiVersion: v1
kind: Service
metadata:
  name: order-agent
  namespace: agents
spec:
  selector:
    app: ai-order-agent
  ports:
    - port: 8000
      targetPort: 8000
