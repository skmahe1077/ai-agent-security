# Same password values as k8s/cnpg/agent-db-secrets.yaml, copied into the
# `agents` namespace so mahi-tools' Deployment can mount them -- see that
# file's header comment on why this is two Secrets, not one.
apiVersion: v1
kind: Secret
metadata:
  name: agent-order-db-creds
  namespace: agents
type: Opaque
stringData:
  password: "${AGENT_ORDER_DB_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-refund-db-creds
  namespace: agents
type: Opaque
stringData:
  password: "${AGENT_REFUND_DB_PASSWORD}"
