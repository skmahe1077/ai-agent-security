# Helm values for the `spire` chart from the spiffe/helm-charts-hardened
# repo. Applied by ArgoCD (k8s/argocd/apps/spire.yaml), not by hand --
# that Application pins spire-crds to 0.6.1 and spire to 0.30.4. Chart
# version PINNED deliberately -- an unversioned `helm install` against a
# chart repo is a real risk for a conference demo. Both versions confirmed
# to exist via `helm search repo --versions` before being written down
# here, not assumed.
#
# The chart bundles SPIRE Server, SPIRE Agent, the Controller Manager, the
# SPIFFE CSI Driver, and the OIDC Discovery Provider -- and this demo
# actually uses the Discovery Provider: Envoy Gateway's SecurityPolicy
# fetches its remoteJWKS from spire-spiffe-oidc-discovery-provider's
# Service (see k8s/gateway/), so keys rotate automatically and there is no
# static JWKS bundle to go stale or refresh.
global:
  spire:
    clusterName: kubecon-agent-demo
    trustDomain: mahistores.demo
    # Becomes BOTH the JWT-SVID `iss` claim SPIRE mints AND the `issuer`
    # field the OIDC discovery document advertises -- Envoy Gateway's
    # SecurityPolicy.spec.jwt.providers[].issuer must match this exactly.
    jwtIssuer: "https://spire-spiffe-oidc-discovery-provider.spire-mgmt.svc.cluster.local"
    recommendations:
      enabled: true # wires up k8s_psat node attestor + k8s workload attestor with sane defaults
      # recommendations.enabled defaults namespaceLayout to true, which
      # splits server/agent across spire-server/spire-system namespaces.
      # This repo's scripts and docs hardcode a single spire-mgmt
      # namespace -- keep that assumption true.
      namespaceLayout: false
    namespaces:
      create: true
    # Required by the chart (no default) -- this demo's SPIRE CA isn't a
    # real PKI trust anchor beyond the cluster's own lifetime (torn down
    # daily), so these are just a fixed, demo-appropriate subject.
    caSubject:
      country: "US"
      organization: "Mahi Stores Demo"
      commonName: "mahistores.demo"
  openshift: false
  # The chart's own documented fix for exactly this situation: ArgoCD
  # renders this chart via `helm template`, not `helm install`/`helm
  # upgrade`, so it has no concept of "first install" vs "upgrade" --
  # every sync runs ALL hooks, including this chart's pre-upgrade-only
  # hook that tries to patch a ValidatingWebhookConfiguration which
  # doesn't exist yet on a fresh install. Confirmed live: that hook job
  # looped on "not found" and blocked the rest of the chart's resources
  # from ever being created. The chart's own values.yaml documents this
  # flag as "should be disabled when using `helm template`" -- which is
  # precisely ArgoCD's rendering model.
  installAndUpgradeHooks:
    enabled: false

spire-server:
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        # refund-agent. Matches terraform/variables.tf's
        # agent_namespace/agent_service_account defaults and
        # policy/rego's per-path rules. If you change one, change all three.
        ai-support-agent-secure:
          namespaceSelector:
            matchExpressions:
              - key: "kubernetes.io/metadata.name"
                operator: In
                values: ["agents"]
          podSelector:
            matchLabels:
              app: ai-support-agent-secure
          # 5 minutes -- SPIRE's own default, left alone deliberately so
          # the "short-lived credential" story is true by default rather
          # than tuned to look good on stage.
          jwtTTL: "300s"
        # order-agent -- a genuinely separate identity, same namespace.
        # Matches terraform/variables.tf's order_agent_service_account. The
        # namespace boundary already distinguishes nimbus/insecure from
        # agents/secure; this podSelector is what distinguishes the two
        # secure identities from each other within `agents`.
        ai-order-agent:
          namespaceSelector:
            matchExpressions:
              - key: "kubernetes.io/metadata.name"
                operator: In
                values: ["agents"]
          podSelector:
            matchLabels:
              app: ai-order-agent
          jwtTTL: "300s"

# Serve the discovery document and JWKS over plain HTTP inside the
# cluster, not SPIRE-issued TLS -- a deliberate simplification for
# in-cluster traffic on a demo torn down daily, not for production. The
# chart fronts this with an nginx sidecar on a fixed `http` port either
# way (see templates/deployment.yaml), so Envoy Gateway's remoteJWKS just
# targets a plain Service.
spiffe-oidc-discovery-provider:
  enabled: true
  tls:
    spire:
      enabled: false
